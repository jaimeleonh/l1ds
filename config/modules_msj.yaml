sc:
  name: SeededConeJet
  path: modules.jet
  parameters:
    max_jets: 20
    max_const: 999
    update_mask: true
    R_seed: 0.4
    R_cen: 0.4
    R_clu: 0.4
    part_type: PuppiExtended
    # part_type: L1ExtPuppi
    output_name: L1ExtPuppi

